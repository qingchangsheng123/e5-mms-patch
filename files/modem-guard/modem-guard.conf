# e5-modem-guard 配置（改完 restart 服务生效：/etc/init.d/e5-modem-guard restart）

# 检查间隔（秒）。2026-11-10 从 60 调到 180：每轮会发一条 AT+CFUN? 做射频
# 校验，60s 会把深睡窗口切碎、抬高底噪电流。丢短信的检测延迟最坏
# INTERVAL x BAD_LIMIT = 9 分钟，可接受。
INTERVAL=180
# 连续多少次异常才动手
BAD_LIMIT=3
# 1 = 自动分级恢复；0 = 只记录不动作
ENABLE_RECOVER=1
# 1 = 三级恢复都失败且持续 REBOOT_MINUTES 分钟后重启系统
ENABLE_REBOOT=0
REBOOT_MINUTES=20
# 每 N 分钟写一条心跳（0 = 不写）
HEARTBEAT=0
# 一直未注册（搜网/使能中）连续多少次才动手；弱信号环境会自己重搜，别太快
SEARCH_LIMIT=10
